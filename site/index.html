<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>첫방문UV 월간 리포트</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect x='1' y='8' width='3.5' height='7' rx='1' fill='%232a78d6'/%3E%3Crect x='6' y='4' width='3.5' height='11' rx='1' fill='%23eb6834'/%3E%3Crect x='11' y='1' width='3.5' height='14' rx='1' fill='%231baf7a'/%3E%3C/svg%3E">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
:root{
  color-scheme: light;
  --page:#f6f6f4; --surface:#ffffff; --ink:#111110; --ink2:#55544f; --muted:#8c8a84;
  --grid:#ebeae5; --baseline:#c9c8bf; --border:rgba(17,17,16,.08); --hover:rgba(17,17,16,.04);
  --accent:#111110; --warn:#a85a00; --warn-bg:rgba(237,161,0,.10);
  --c1:#2a78d6; --c2:#eb6834; --c3:#1baf7a; --c4:#eda100;
  --c5:#e87ba4; --c6:#008300; --c7:#4a3aa7; --c8:#e34948;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --page:#0e0e0d; --surface:#181817; --ink:#f4f4f2; --ink2:#c3c2b7; --muted:#8c8a84;
    --grid:#2a2a28; --baseline:#3a3a37; --border:rgba(255,255,255,.08); --hover:rgba(255,255,255,.05);
    --accent:#f4f4f2; --warn:#e0a040; --warn-bg:rgba(237,161,0,.12);
    --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
    --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --page:#0e0e0d; --surface:#181817; --ink:#f4f4f2; --ink2:#c3c2b7; --muted:#8c8a84;
  --grid:#2a2a28; --baseline:#3a3a37; --border:rgba(255,255,255,.08); --hover:rgba(255,255,255,.05);
  --accent:#f4f4f2; --warn:#e0a040; --warn-bg:rgba(237,161,0,.12);
  --c1:#3987e5; --c2:#d95926; --c3:#199e70; --c4:#c98500;
  --c5:#d55181; --c6:#008300; --c7:#9085e9; --c8:#e66767;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--page);color:var(--ink);
  font:14px/1.55 "Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,system-ui,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  letter-spacing:-.01em;padding:0 16px 64px;-webkit-font-smoothing:antialiased}
.wrap{max-width:1120px;margin:0 auto}
.num,td.num,th.num{font-variant-numeric:tabular-nums}

/* 헤더 */
header{display:flex;align-items:flex-end;gap:12px;padding:32px 0 20px}
.title h1{font-size:22px;line-height:1.3;margin:0;font-weight:700;letter-spacing:-.02em}
.title p{margin:4px 0 0;color:var(--muted);font-size:13px}
.spacer{flex:1}
.btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 12px;
  background:var(--surface);color:var(--ink);border:1px solid var(--border);border-radius:9px;
  font:inherit;font-size:13px;font-weight:500;cursor:pointer;transition:border-color .15s,background .15s}
.btn:hover{border-color:var(--baseline)}
.btn:disabled{opacity:.4;cursor:default}
.btn.icon{width:34px;padding:0;justify-content:center}
.btn svg{width:16px;height:16px}

/* 월 탭 */
.tabs-wrap{position:sticky;top:0;z-index:5;background:var(--page);margin:0 -16px;padding:0 16px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--border)}
.tabs::-webkit-scrollbar{display:none}
.tab{position:relative;flex:none;display:flex;flex-direction:column;align-items:center;gap:1px;
  padding:10px 14px 11px;background:none;border:0;color:var(--muted);font:inherit;cursor:pointer;
  transition:color .15s}
.tab .y{font-size:11px;line-height:1;height:11px}
.tab .m{font-size:15px;font-weight:600;line-height:1.2}
.tab:hover{color:var(--ink2)}
.tab[aria-selected="true"]{color:var(--ink)}
.tab[aria-selected="true"]::after{content:"";position:absolute;left:10px;right:10px;bottom:-1px;height:2px;
  border-radius:2px;background:var(--accent)}
.tab.nodata .m{font-weight:500;opacity:.55}
.tab .dot{position:absolute;top:9px;right:7px;width:5px;height:5px;border-radius:50%;background:var(--c4)}

.meta{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;color:var(--muted);font-size:12px;margin:14px 0 18px}
.meta code{font-family:inherit;color:var(--ink2)}
.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:500;color:var(--warn);
  background:var(--warn-bg);border-radius:999px;padding:2px 10px}

/* 노티 */
.notice{background:var(--surface);border:1px solid var(--border);border-radius:16px;
  padding:56px 24px;text-align:center;margin-top:18px}
.notice .ic{width:44px;height:44px;margin:0 auto 14px;border-radius:12px;display:grid;place-items:center;
  background:var(--hover);color:var(--ink2)}
.notice .ic svg{width:22px;height:22px}
.notice h2{font-size:17px;margin:0 0 6px;font-weight:700}
.notice p{margin:0;color:var(--ink2);font-size:13px}
.notice .sub{margin-top:14px;color:var(--muted);font-size:12px}

/* KPI */
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:16px}
.tile{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:16px 18px}
.tile .lbl{color:var(--ink2);font-size:12px;font-weight:500}
.tile .val{font-size:26px;font-weight:700;letter-spacing:-.02em;margin-top:6px;line-height:1.2;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .val.sm{font-size:18px;line-height:1.75}
.tile .sub{color:var(--muted);font-size:12px;margin-top:4px;min-height:18px}
.delta{font-weight:600}
.delta.up{color:var(--c3)} .delta.down{color:var(--c8)}

/* 카드 */
.card{background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:20px;margin-bottom:16px}
.card-h{display:flex;flex-wrap:wrap;align-items:baseline;gap:4px 10px;margin-bottom:14px}
.card-h h2{font-size:15px;margin:0;font-weight:700}
.card-h .desc{color:var(--muted);font-size:12px}
.grid2{display:grid;grid-template-columns:minmax(0,1fr);gap:16px}

.legend{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:12px}
.legend button{display:flex;align-items:center;gap:6px;border:0;background:none;padding:3px 0;
  color:var(--ink2);font:inherit;font-size:12px;cursor:pointer}
.legend button.off{opacity:.35}
.chip{width:9px;height:9px;border-radius:3px;display:inline-block;flex:none}
#chart{width:100%;display:block}
.tip{position:fixed;pointer-events:none;background:var(--surface);color:var(--ink);
  border:1px solid var(--border);border-radius:10px;padding:10px 12px;font-size:12px;
  box-shadow:0 8px 24px rgba(0,0,0,.14);z-index:20;display:none;min-width:180px;max-width:280px}
.tip .row{display:flex;align-items:center;gap:6px;margin-top:3px}
.tip .row .n{margin-left:auto;font-variant-numeric:tabular-nums;padding-left:14px}
.tip .tot{border-top:1px solid var(--grid);margin-top:6px;padding-top:6px;font-weight:600}

/* 표 */
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:9px 10px;text-align:left;border-bottom:1px solid var(--grid)}
th{color:var(--muted);font-weight:500;font-size:12px;white-space:nowrap;user-select:none}
#detail th{cursor:pointer}
#detail th:hover{color:var(--ink2)}
th.num,td.num{text-align:right}
tbody tr:last-child td{border-bottom:0}
tbody tr:hover{background:var(--hover)}
.chn{display:flex;align-items:center;gap:8px;min-width:0}
.bar-cell{display:flex;align-items:center;gap:10px}
.bar-track{flex:1;height:6px;border-radius:3px;background:var(--hover);overflow:hidden}
.bar-track i{display:block;height:100%;border-radius:3px}
.pct{color:var(--ink2);font-size:12px;width:44px;text-align:right;font-variant-numeric:tabular-nums}
.toolbar{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:12px;align-items:center}
.field{height:34px;padding:0 10px;background:var(--surface);color:var(--ink);border:1px solid var(--border);
  border-radius:9px;font:inherit;font-size:13px}
.field:focus,.btn:focus-visible,.tab:focus-visible{outline:2px solid var(--c1);outline-offset:1px}
input.field{min-width:200px}
.toolbar .count{color:var(--muted);font-size:12px;margin-left:auto}
.table-scroll{overflow-x:auto}
.pager{display:flex;gap:8px;align-items:center;justify-content:center;margin-top:14px;color:var(--ink2);font-size:13px}

@media (max-width:860px){ .tiles{grid-template-columns:repeat(2,1fr)} }
@media (max-width:560px){
  header{align-items:flex-start;padding-top:24px}
  .title p{font-size:12px}
  .title h1{font-size:19px}
  .tile .val{font-size:22px}
  .card{padding:16px}
  th,td{padding:8px 6px}
  #detail td,#detail th{white-space:nowrap}
  input.field{min-width:0;flex:1}
  .hide-sm{display:none}
}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="title">
      <h1>첫방문UV 월간 리포트</h1>
      <p>GA4 · 맞춤채널(운영) · 첫방문(세션) 세그먼트</p>
    </div>
    <div class="spacer"></div>
    <button class="btn" id="csvBtn" title="선택 월 상세 데이터 CSV 다운로드" disabled>
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M8 2v8m0 0L5 7m3 3 3-3M3 12.5h10"/></svg>
      <span class="hide-sm">CSV</span>
    </button>
    <button class="btn icon" id="themeBtn" title="라이트/다크 전환" aria-label="테마 전환">
      <svg viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="8" cy="8" r="5.5"/><path d="M8 2.5a5.5 5.5 0 0 1 0 11z" fill="currentColor"/></svg>
    </button>
  </header>

  <div class="tabs-wrap"><nav class="tabs" id="tabs" role="tablist" aria-label="월 선택"></nav></div>

  <div id="notice" class="notice" hidden>
    <div class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15" rx="3"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg></div>
    <h2 id="nTitle"></h2>
    <p id="nBody"></p>
    <p class="sub" id="nSub"></p>
  </div>

  <div id="content" hidden>
    <div class="meta" id="meta"></div>

    <div class="tiles">
      <div class="tile"><div class="lbl">월 총 사용자</div><div class="val num" id="kTotal">–</div><div class="sub" id="kTotalSub"></div></div>
      <div class="tile"><div class="lbl">일평균 사용자</div><div class="val num" id="kAvg">–</div><div class="sub" id="kAvgSub"></div></div>
      <div class="tile"><div class="lbl">최대 일자</div><div class="val num" id="kPeak">–</div><div class="sub" id="kPeakSub"></div></div>
      <div class="tile"><div class="lbl">1위 채널</div><div class="val sm" id="kTop">–</div><div class="sub" id="kTopSub"></div></div>
    </div>

    <section class="card">
      <div class="card-h"><h2>일자별 첫방문 UV</h2><span class="desc">채널 누적 · 범례 클릭으로 채널 표시 전환</span></div>
      <svg id="chart" height="300" role="img" aria-label="일자별 채널 누적 막대 차트"></svg>
      <div class="legend" id="legend"></div>
    </section>

    <section class="card">
      <div class="card-h"><h2>채널 요약</h2><span class="desc">월 전체 · 채널 내 중복 제거</span></div>
      <div class="table-scroll">
      <table id="chTable"><thead><tr>
        <th>맞춤채널(운영)</th><th class="num">총 사용자</th><th class="num hide-sm">전월 대비</th><th style="width:38%">비중</th>
      </tr></thead><tbody></tbody></table>
      </div>
    </section>

    <section class="card">
      <div class="card-h"><h2>상세 데이터</h2><span class="desc">날짜 × 맞춤채널(운영) × 세션 소스/매체</span></div>
      <div class="toolbar">
        <select class="field" id="chFilter" aria-label="채널 필터"><option value="">전체 채널</option></select>
        <input class="field" type="search" id="smSearch" placeholder="소스/매체 검색" aria-label="소스/매체 검색">
        <span class="count" id="rowCount"></span>
      </div>
      <div class="table-scroll">
      <table id="detail"><thead><tr>
        <th data-k="date">날짜</th><th data-k="channel">맞춤채널(운영)</th>
        <th data-k="source_medium">세션 소스/매체</th><th class="num" data-k="users">총 사용자</th>
      </tr></thead><tbody></tbody></table>
      </div>
      <div class="pager">
        <button class="btn" id="prevPg">이전</button><span id="pgInfo" class="num"></span><button class="btn" id="nextPg">다음</button>
      </div>
    </section>
  </div>
</div>
<div class="tip" id="tip"></div>

<script>
"use strict";
/* ---------- 설정 ---------- */
const FIRST_MONTH = "2026-08";          // BigQuery 내보내기 기준 최초 집계 가능 월
const RUN_DAY = 2, RUN_TIME = "10:17";  // 정기 집계: 매월 2일 10:17 KST

// 채널 색상·정렬: GA 채널명 접두어 기준 (접미어 변경에도 동일 색상 유지)
const CHANNEL_BASES = ["직접유입","검색광고","브랜드검색광고","자연유입","배너광고","추천유입","메세지광고","Unassigned"];
const baseIdx = ch => { const i = CHANNEL_BASES.findIndex(b=>String(ch).startsWith(b)); return i<0 ? 99 : i; };
const orderCh = arr => [...new Set(arr)].sort((a,b)=>baseIdx(a)-baseIdx(b) || String(a).localeCompare(String(b),"ko"));
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const color = ch => { const i = baseIdx(ch); return css(i<8 ? "--c"+(i+1) : "--muted"); };
const fmt = n => (n==null?"–":Number(n).toLocaleString("ko-KR"));
const dstr = d => `${d.slice(0,4)}.${d.slice(4,6)}.${d.slice(6,8)}`;
const esc = s => String(s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");
const $ = id => document.getElementById(id);

/* ---------- 월 계산 (KST 기준) ---------- */
const kstNow = () => new Date(Date.now() + 9*3600e3);          // UTC 필드로 KST 값 사용
const ym = (y,m) => `${y}-${String(m).padStart(2,"0")}`;
const addMonth = (s,k) => { let [y,m] = s.split("-").map(Number); m += k;
  while(m>12){m-=12;y++} while(m<1){m+=12;y--} return ym(y,m); };
const curMonth = () => { const t = kstNow(); return ym(t.getUTCFullYear(), t.getUTCMonth()+1); };
const runAt = m => { const n = addMonth(m,1); return `${n}-${String(RUN_DAY).padStart(2,"0")} ${RUN_TIME}`; };
const runPassed = m => { const t = kstNow();
  const now = `${ym(t.getUTCFullYear(),t.getUTCMonth()+1)}-${String(t.getUTCDate()).padStart(2,"0")} ${String(t.getUTCHours()).padStart(2,"0")}:${String(t.getUTCMinutes()).padStart(2,"0")}`;
  return now >= runAt(m); };
const label = m => { const [y,mm] = m.split("-"); return {y, m: `${+mm}월`, full: `${y}년 ${+mm}월`}; };

/* ---------- 상태 ---------- */
let months = [], have = new Set(), sel = null;
let cur = null, prev = null;
let hidden = new Set(), sortKey = "date", sortAsc = true, page = 1;
const PAGE = 25, cache = {};

/* ---------- 테마 ---------- */
$("themeBtn").onclick = () => {
  const r = document.documentElement;
  const dark = r.dataset.theme === "dark" || (!r.dataset.theme && matchMedia("(prefers-color-scheme: dark)").matches);
  r.dataset.theme = dark ? "light" : "dark";
  try{ localStorage.setItem("theme", r.dataset.theme); }catch(e){}
  if(cur) render();
};
try{ const t = localStorage.getItem("theme"); if(t) document.documentElement.dataset.theme = t; }catch(e){}

/* ---------- 로드 ---------- */
async function getMonth(m){
  if(!have.has(m)) return null;
  if(!cache[m]) cache[m] = fetch(`data/${m}.json`, {cache:"no-cache"}).then(r=>r.ok?r.json():null).catch(()=>null);
  return cache[m];
}

async function boot(){
  let idx = {months:[]};
  try{ idx = await (await fetch("data/index.json", {cache:"no-cache"})).json(); }catch(e){}
  have = new Set(idx.months || []);
  // 탭 범위: 최초 월 ~ 이번 달 (+ 범위 밖 데이터 월)
  const end = curMonth(), set = new Set(have);
  for(let m = FIRST_MONTH; m <= end; m = addMonth(m,1)) set.add(m);
  months = [...set].sort();
  const fromHash = decodeURIComponent(location.hash.slice(1));
  const latest = [...have].sort().pop();
  drawTabs();
  select(months.includes(fromHash) ? fromHash : (latest || months[months.length-1]), false);
}

function drawTabs(){
  const el = $("tabs");
  el.innerHTML = months.map((m,i)=>{
    const l = label(m), showY = i===0 || m.slice(0,4)!==months[i-1].slice(0,4);
    const nd = !have.has(m);
    return `<button class="tab${nd?" nodata":""}" role="tab" data-m="${m}" aria-selected="false"
      title="${l.full}${nd?" · 데이터 없음":""}"><span class="y">${showY?l.y:""}</span><span class="m">${l.m}</span></button>`;
  }).join("");
  el.querySelectorAll(".tab").forEach(b=>b.onclick = () => select(b.dataset.m, true));
  el.onkeydown = e => {
    if(e.key!=="ArrowLeft" && e.key!=="ArrowRight") return;
    const i = months.indexOf(sel) + (e.key==="ArrowRight"?1:-1);
    if(i>=0 && i<months.length){ select(months[i], true); el.querySelector(`[data-m="${months[i]}"]`).focus(); }
  };
}

async function select(m, push){
  sel = m;
  if(push) history.replaceState(null, "", "#"+m);
  document.querySelectorAll(".tab").forEach(b=>{
    const on = b.dataset.m===m;
    b.setAttribute("aria-selected", on); b.tabIndex = on ? 0 : -1;
    if(on) b.scrollIntoView({block:"nearest", inline:"nearest"});
  });
  const data = await getMonth(m);
  if(sel!==m) return;                                   // 빠른 탭 전환 시 이전 응답 무시
  if(!data){ showNotice(m); return; }
  cur = data; prev = await getMonth(addMonth(m,-1));
  if(sel!==m) return;
  hidden.clear(); page = 1; sortKey = "date"; sortAsc = true;
  $("chFilter").value = ""; $("smSearch").value = "";
  $("notice").hidden = true; $("content").hidden = false; $("csvBtn").disabled = false;
  render(); initDetail();
}

/* ---------- 데이터 없음 노티 ---------- */
function showNotice(m){
  cur = null;
  $("content").hidden = true; $("notice").hidden = false; $("csvBtn").disabled = true;
  const l = label(m), at = runAt(m).replace(/-/g,".");
  if(m >= curMonth()){
    $("nTitle").textContent = `${l.full} 집계 전`;
    $("nBody").textContent = "진행 중인 월. 월 종료 후 정기 집계 대상.";
    $("nSub").textContent = `집계 예정 ${at} KST`;
  }else if(!runPassed(m)){
    $("nTitle").textContent = `${l.full} 집계 대기`;
    $("nBody").textContent = "GA4 일일 내보내기 지연 대비 2일 집계.";
    $("nSub").textContent = `집계 예정 ${at} KST`;
  }else{
    $("nTitle").textContent = `${l.full} 데이터 없음`;
    $("nBody").textContent = "정기 집계 미완료 또는 실패.";
    $("nSub").textContent = `GitHub Actions › 월간 첫방문UV 리포트 추출 › Run workflow (month: ${m})`;
  }
}

/* ---------- 렌더 ---------- */
function render(){
  const gen = (cur.generated_at||"").replace("T"," ").slice(0,16);
  $("meta").innerHTML =
    `<span>${label(cur.month).full} · ${cur.days_available}일</span><span>집계 ${esc(gen)} KST</span>` +
    `<span class="hide-sm">원본 <code>${esc(cur.source)}</code></span>` +
    (cur.partial ? `<span class="pill">미완성 월 · 수집 ${cur.days_available}일</span>` : "");
  drawKpis(); drawChart(); drawLegend(); drawChannelTable();
}

function deltaHtml(a, b){
  if(b==null || !b) return "";
  const d = 100*(a-b)/b, cls = d>0.05 ? "up" : d<-0.05 ? "down" : "";
  return `<span class="delta ${cls}">${d>0?"+":""}${d.toFixed(1)}%</span>`;
}
function drawKpis(){
  const bd = cur.by_date || [];
  const avg = bd.length ? Math.round(bd.reduce((s,r)=>s+r.users,0)/bd.length) : 0;
  const pbd = prev?.by_date || [];
  const pavg = pbd.length ? Math.round(pbd.reduce((s,r)=>s+r.users,0)/pbd.length) : null;
  const pl = prev ? label(prev.month).m : "";
  $("kTotal").textContent = fmt(cur.total_users);
  $("kTotalSub").innerHTML = prev ? `${pl} 대비 ${deltaHtml(cur.total_users, prev.total_users)}` : "전월 데이터 없음";
  $("kAvg").textContent = fmt(avg);
  $("kAvgSub").innerHTML = prev ? `${pl} 대비 ${deltaHtml(avg, pavg)}` : `${bd.length}일 기준`;
  const peak = bd.reduce((a,b)=>b.users>a.users?b:a, {users:-1});
  $("kPeak").textContent = peak.users>=0 ? fmt(peak.users) : "–";
  $("kPeakSub").textContent = peak.date ? dstr(peak.date) : "";
  const top = (cur.by_channel||[]).reduce((a,b)=>!a||b.users>a.users?b:a, null);
  $("kTop").textContent = top ? top.channel : "–";
  $("kTop").title = top ? top.channel : "";
  $("kTopSub").textContent = top && cur.total_users ? `비중 ${(100*top.users/cur.total_users).toFixed(1)}%` : "";
}

/* ---------- 차트 ---------- */
function drawChart(){
  const svg = $("chart");
  const W = svg.clientWidth || 900, H = 300, mL=48, mR=4, mT=10, mB=26;
  svg.setAttribute("viewBox", `0 0 ${W} ${H}`);
  const days = [...new Set(cur.by_date_channel.map(r=>r.date))].sort();
  const byDay = {}; days.forEach(d=>byDay[d]={});
  cur.by_date_channel.forEach(r=>{ byDay[r.date][r.channel]=r.users; });
  const active = orderCh(cur.by_date_channel.map(r=>r.channel)).filter(c=>!hidden.has(c));
  const totals = days.map(d=>active.reduce((s,c)=>s+(byDay[d][c]||0),0));
  const niceMax = niceCeil(Math.max(1, ...totals));
  const iw = W-mL-mR, ih = H-mT-mB, slot = iw/Math.max(1,days.length);
  const bw = Math.max(3, Math.min(28, slot*0.62));
  const x = i => mL + slot*(i+0.5);
  const y = v => mT + ih*(1 - v/niceMax);
  const muted = css('--muted'), grid = css('--grid'), base = css('--baseline');
  let s = "";
  for(let t=0;t<=4;t++){
    const v = niceMax*t/4, yy = y(v);
    s += `<line x1="${mL}" y1="${yy}" x2="${W-mR}" y2="${yy}" stroke="${t?grid:base}" stroke-width="1"/>`;
    s += `<text x="${mL-8}" y="${yy+4}" text-anchor="end" font-size="11" fill="${muted}" style="font-variant-numeric:tabular-nums">${fmt(v)}</text>`;
  }
  const step = Math.ceil(days.length/(W<560?6:11));
  days.forEach((d,i)=>{
    if(i%step===0) s += `<text x="${x(i)}" y="${H-8}" text-anchor="middle" font-size="11" fill="${muted}">${+d.slice(6,8)}일</text>`;
  });
  days.forEach((d,i)=>{
    let acc = 0;
    const segs = active.map(c=>({c, v: byDay[d][c]||0})).filter(o=>o.v>0);
    segs.forEach((o,si)=>{
      const y1 = y(acc+o.v), y0 = y(acc);
      const hpx = Math.max(1, y0-y1 - (si<segs.length-1?1.5:0));
      s += `<path d="${roundedTop(x(i)-bw/2, y1, bw, hpx, si===segs.length-1?3:0)}" fill="${color(o.c)}" data-day="${d}"/>`;
      acc += o.v;
    });
    s += `<rect x="${x(i)-slot/2}" y="${mT}" width="${slot}" height="${ih}" fill="transparent" data-day="${d}"/>`;
  });
  svg.innerHTML = s;
  const tip = $("tip");
  const show = (e, t) => {
    const rows = active.map(c=>({c, v: byDay[t][c]||0})).filter(o=>o.v>0).sort((a,b)=>b.v-a.v);
    const tot = rows.reduce((s,o)=>s+o.v,0);
    tip.innerHTML = `<b>${dstr(t)}</b>` +
      rows.map(o=>`<div class="row"><span class="chip" style="background:${color(o.c)}"></span>${esc(o.c)}<span class="n">${fmt(o.v)}</span></div>`).join("") +
      `<div class="row tot">합계<span class="n">${fmt(tot)}</span></div>`;
    tip.style.display = "block";
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    tip.style.left = Math.max(8, Math.min(e.clientX+14, innerWidth-tw-8))+"px";
    tip.style.top = Math.max(8, Math.min(e.clientY-th/2, innerHeight-th-8))+"px";
  };
  svg.onpointermove = e => {
    const t = e.target.getAttribute && e.target.getAttribute("data-day");
    t ? show(e, t) : (tip.style.display="none");
  };
  svg.onpointerleave = () => tip.style.display="none";
}
function roundedTop(x,y,w,h,r){
  r = Math.min(r, h, w/2);
  return `M${x},${y+h} L${x},${y+r} Q${x},${y} ${x+r},${y} L${x+w-r},${y} Q${x+w},${y} ${x+w},${y+r} L${x+w},${y+h} Z`;
}
function niceCeil(v){
  const p = Math.pow(10, Math.floor(Math.log10(v)));
  for(const m of [1,2,2.5,4,5,8,10]) if(m*p>=v) return m*p;
  return 10*p;
}

/* ---------- 범례 ---------- */
function drawLegend(){
  const el = $("legend"); el.innerHTML = "";
  orderCh(cur.by_date_channel.map(r=>r.channel)).forEach(c=>{
    const b = document.createElement("button");
    b.innerHTML = `<span class="chip" style="background:${color(c)}"></span>${esc(c)}`;
    b.className = hidden.has(c) ? "off" : "";
    b.setAttribute("aria-pressed", !hidden.has(c));
    b.onclick = () => { hidden.has(c)?hidden.delete(c):hidden.add(c);
      b.className = hidden.has(c)?"off":""; b.setAttribute("aria-pressed", !hidden.has(c)); drawChart(); };
    el.appendChild(b);
  });
}

/* ---------- 채널 요약 ---------- */
function drawChannelTable(){
  const rows = [...(cur.by_channel||[])].sort((a,b)=>b.users-a.users);
  const max = Math.max(1, ...rows.map(r=>r.users));
  const pmap = {}; (prev?.by_channel||[]).forEach(r=>pmap[r.channel]=r.users);
  document.querySelector("#chTable tbody").innerHTML = rows.map(r=>{
    const pct = cur.total_users ? (100*r.users/cur.total_users) : 0;
    return `<tr><td><span class="chn"><span class="chip" style="background:${color(r.channel)}"></span>${esc(r.channel)}</span></td>
      <td class="num">${fmt(r.users)}</td>
      <td class="num hide-sm">${prev ? (deltaHtml(r.users, pmap[r.channel]) || "–") : "–"}</td>
      <td><div class="bar-cell"><div class="bar-track"><i style="width:${(100*r.users/max).toFixed(1)}%;background:${color(r.channel)}"></i></div><span class="pct">${pct.toFixed(1)}%</span></div></td></tr>`;
  }).join("");
}

/* ---------- 상세 테이블 ---------- */
function initDetail(){
  $("chFilter").innerHTML = `<option value="">전체 채널</option>` +
    orderCh(cur.rows.map(r=>r.channel)).map(c=>`<option>${esc(c)}</option>`).join("");
  drawDetail();
}
$("chFilter").onchange = () => {page=1; drawDetail();};
$("smSearch").oninput = () => {page=1; drawDetail();};
document.querySelectorAll("#detail th").forEach(th=>{
  th.dataset.label = th.textContent;
  th.onclick = () => {
    const k = th.dataset.k;
    if(sortKey===k) sortAsc=!sortAsc; else {sortKey=k; sortAsc = k!=="users";}
    page=1; drawDetail();
  };
});
$("prevPg").onclick = ()=>{ if(page>1){page--; drawDetail();} };
$("nextPg").onclick = ()=>{ page++; drawDetail(); };

function filteredRows(){
  const ch = $("chFilter").value, q = $("smSearch").value.trim().toLowerCase();
  let rows = cur.rows;
  if(ch) rows = rows.filter(r=>r.channel===ch);
  if(q) rows = rows.filter(r=>r.source_medium.toLowerCase().includes(q));
  return [...rows].sort((a,b)=>{
    const va=a[sortKey], vb=b[sortKey];
    const c = typeof va==="number" ? va-vb : String(va).localeCompare(String(vb),"ko");
    return sortAsc ? c : -c;
  });
}
function drawDetail(){
  if(!cur) return;
  const rows = filteredRows(), pages = Math.max(1, Math.ceil(rows.length/PAGE));
  page = Math.min(page, pages);
  document.querySelector("#detail tbody").innerHTML = rows.slice((page-1)*PAGE, page*PAGE).map(r=>
    `<tr><td class="num">${dstr(r.date)}</td>
     <td><span class="chn"><span class="chip" style="background:${color(r.channel)}"></span>${esc(r.channel)}</span></td>
     <td>${esc(r.source_medium)}</td><td class="num">${fmt(r.users)}</td></tr>`).join("");
  $("rowCount").textContent = `${fmt(rows.length)}행`;
  $("pgInfo").textContent = `${page} / ${pages}`;
  $("prevPg").disabled = page<=1; $("nextPg").disabled = page>=pages;
  document.querySelectorAll("#detail th").forEach(th=>{
    th.textContent = th.dataset.label + (th.dataset.k===sortKey ? (sortAsc?" ↑":" ↓") : "");
  });
}

/* ---------- CSV ---------- */
$("csvBtn").onclick = () => {
  if(!cur) return;
  const head = "날짜,맞춤채널(운영),세션 소스/매체,총 사용자\n";
  const q = v => `"${String(v).replace(/"/g,'""')}"`;
  const body = cur.rows.map(r=>[dstr(r.date).replace(/\./g,"-"), q(r.channel), q(r.source_medium), r.users].join(",")).join("\n");
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob(["﻿"+head+body], {type:"text/csv;charset=utf-8"}));
  a.download = `첫방문UV_${cur.month}.csv`;
  a.click(); setTimeout(()=>URL.revokeObjectURL(a.href), 1000);
};

let rz; addEventListener("resize", () => { clearTimeout(rz); rz = setTimeout(()=>{ if(cur) drawChart(); }, 120); });
addEventListener("hashchange", () => { const m = decodeURIComponent(location.hash.slice(1)); if(months.includes(m) && m!==sel) select(m, false); });
boot();
</script>
